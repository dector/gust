name: snapshot

on:
  push:
    branches:
      - trunk

concurrency:
  group: snapshot-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: build linux ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p build/package
          go build -trimpath -ldflags='-s -w' -o build/package/gust ./cmd/gust
          tar -C build/package -czf "gust-${GOOS}-${GOARCH}.tar.gz" gust

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gust-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gust-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    name: publish snapshot release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: snapshot
        run: |
          set -euo pipefail

          git tag --force "$SNAPSHOT_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$SNAPSHOT_TAG"

          notes="Snapshot build for $GITHUB_SHA. This release is replaced on every push to trunk."
          if gh release view "$SNAPSHOT_TAG" >/dev/null 2>&1; then
            gh release edit "$SNAPSHOT_TAG" --title "$SNAPSHOT_TAG" --notes "$notes" --prerelease
          else
            gh release create "$SNAPSHOT_TAG" --title "$SNAPSHOT_TAG" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi

          gh release view "$SNAPSHOT_TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            [ -n "$asset" ] || continue
            gh release delete-asset "$SNAPSHOT_TAG" "$asset" --yes
          done

          gh release upload "$SNAPSHOT_TAG" dist/* --clobber
